<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05060a" />
    <title>404 — Page not found</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(120% 90% at 50% 0%, #0a0d16 0%, #05060a 46%, #020306 100%);
        color: #f2f4f8;
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .code {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #00e5ff;
        margin: 0 0 1rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 8vw, 3.4rem);
        letter-spacing: -0.03em;
      }
      p { margin: 0 0 2rem; color: #8b93a7; max-width: 34ch; }
      a {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        border: 1px solid rgba(0, 229, 255, 0.4);
        background: rgba(0, 229, 255, 0.08);
        color: #f2f4f8;
        text-decoration: none;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
      }
      a:hover { background: rgba(0, 229, 255, 0.16); }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>Nothing here.</h1>
      <p>The page you were looking for does not exist — but the interesting stuff is one click away.</p>
      <a href="/">Back to the home page</a>
    </main>
  </body>
</html>
